; Sensitive values (WIFI_SSID, WIFI_PASSWORD, API_KEY) live in secrets.ini
; which is gitignored. Copy secrets.ini.example to secrets.ini and fill it in.
[platformio]
extra_configs = secrets.ini

[env:esp32_com3_non_local]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=1
    -D DEVICE_NAME=\"ESP32_COM3\"
    -D PLANT_LABEL=\"PeaceLily\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32_com4_non_local]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=2
    -D DEVICE_NAME=\"ESP32_COM4\"
    -D PLANT_LABEL=\"PrayerPlant\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32_com3_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = ESP32_COM3.local
upload_flags = --auth=plantmonitor2025
monitor_port = COM3
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=1
    -D DEVICE_NAME=\"ESP32_COM3\"
    -D PLANT_LABEL=\"PeaceLily\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32_com4_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = ESP32_COM4.local
upload_flags = --auth=plantmonitor2025
monitor_port = COM4
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=2
    -D DEVICE_NAME=\"ESP32_COM4\"
    -D PLANT_LABEL=\"PrayerPlant\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
