; Sensitive values live in secrets.ini (gitignored).
; Copy secrets.ini.example to secrets.ini and fill in your values.
;
; secrets.ini exposes two sections:
;   ${common.secrets_flags}  — API_KEY + OTA_PASSWORD (every environment)
;   ${legacy.wifi_flags}     — WIFI_SSID + WIFI_PASSWORD (legacy environments only)
;
; The esp32_provisioning environment deliberately omits ${legacy.wifi_flags}
; so WIFI_SSID is never defined, causing the firmware to enter BLE provisioning
; mode on first boot.
;
[platformio]
extra_configs = secrets.ini

[env:esp32_com3_non_local]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=1
    -D DEVICE_NAME=\"ESP32_COM3\"
    -D PLANT_LABEL=\"PeaceLily\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}
    ${legacy.wifi_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32_com4_non_local]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=2
    -D DEVICE_NAME=\"ESP32_COM4\"
    -D PLANT_LABEL=\"PrayerPlant\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}
    ${legacy.wifi_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

; ── Generic provisioning build ───────────────────────────────────────────────
; Flash this to any new ESP32.  On first boot it enters BLE provisioning mode;
; the app sends WiFi credentials and the device generates its own UUID.
; Device name is derived from MAC address at runtime ("PHM-XXYYZZ").
[env:esp32_provisioning]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32_com3_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = ESP32_COM3.local
upload_flags = --auth=plantmonitor2025
monitor_port = COM3
monitor_speed = 115200
board_build.partitions = partitions_ota_large.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=1
    -D DEVICE_NAME=\"ESP32_COM3\"
    -D PLANT_LABEL=\"PeaceLily\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}
    ${legacy.wifi_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:esp32_com4_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = ESP32_COM4.local
upload_flags = --auth=plantmonitor2025
monitor_port = COM4
monitor_speed = 115200
board_build.partitions = partitions_ota_large.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D DEVICE_ID=2
    -D DEVICE_NAME=\"ESP32_COM4\"
    -D PLANT_LABEL=\"PrayerPlant\"
    -D POF02_ENABLE_TINYML_TFLM=1
    ${common.secrets_flags}
    ${legacy.wifi_flags}

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
