; No secrets are stored here.
; WiFi credentials and the Supabase API key are sent to the device at runtime
; over BLE by the phone app — they never touch the build system.
;
[env:esp32_provisioning]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D POF02_ENABLE_TINYML_TFLM=1

lib_deps =
    eloquentarduino/EloquentTinyML
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
