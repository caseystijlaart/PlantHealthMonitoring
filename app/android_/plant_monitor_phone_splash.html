
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

  .phone-wrap {
    display: flex;
    justify-content: center;
    padding: 24px 0 16px;
    background: transparent;
  }

  .phone {
    width: 280px;
    height: 560px;
    background: #0c1a10;
    border-radius: 44px;
    border: 2px solid #2a3d2e;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 26px;
    background: #0c1a10;
    border-radius: 0 0 18px 18px;
    z-index: 10;
    border: 2px solid #2a3d2e;
    border-top: none;
  }

  .phone-inner {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    position: relative;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,222,128,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    animation: gFade 2.5s ease forwards;
  }

  @keyframes gFade { from { opacity:0 } to { opacity:1 } }

  .radial-glow {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46,160,90,0.14) 0%, transparent 70%);
    animation: rpulse 3.2s ease-in-out infinite;
  }

  @keyframes rpulse {
    0%,100% { transform: scale(1); opacity:.6 }
    50%      { transform: scale(1.1); opacity:1 }
  }

  .leaf-ring {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 1px solid rgba(74,222,128,0.15);
    animation: ringIn 0.6s ease 0.2s both, rpulse 3.2s ease-in-out 0.8s infinite;
  }

  .leaf-ring-2 {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 1px solid rgba(74,222,128,0.07);
    animation: ringIn 0.6s ease 0.4s both, rpulse 3.2s ease-in-out 1s infinite;
  }

  @keyframes ringIn { from { opacity:0; transform: scale(0.7) } to { opacity:1; transform: scale(1) } }

  .icon-box {
    position: relative;
    width: 68px;
    height: 68px;
    margin-bottom: 24px;
    animation: iconPop 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.5s both;
  }

  @keyframes iconPop {
    from { opacity:0; transform: scale(0.3) translateY(16px) }
    to   { opacity:1; transform: scale(1) translateY(0) }
  }

  .icon-bg {
    width: 68px;
    height: 68px;
    background: #152a1c;
    border-radius: 18px;
    border: 1px solid rgba(74,222,128,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .title-area {
    text-align: center;
    margin-bottom: 8px;
    animation: fadeUp 0.6s ease 0.9s both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px) }
    to   { opacity:1; transform: translateY(0) }
  }

  .t-main {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: #e4f5e9;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .t-accent { color: #4ade80; font-weight: 300; }

  .tagline {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: rgba(180,230,195,0.45);
    letter-spacing: 2.8px;
    text-transform: uppercase;
    margin-top: 10px;
    animation: fadeUp 0.6s ease 1.1s both;
  }

  .feature-pills {
    display: flex;
    gap: 6px;
    margin-top: 28px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.6s ease 1.3s both;
  }

  .pill {
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.2);
    border-radius: 20px;
    padding: 5px 11px;
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 400;
    color: rgba(180,230,195,0.7);
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .pill-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #4ade80;
    opacity: 0.7;
  }

  .bar-wrap {
    margin-top: 36px;
    width: 140px;
    animation: fadeUp 0.5s ease 1.5s both;
  }

  .bar-track {
    height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: #4ade80;
    border-radius: 2px;
    animation: barLoad 2.6s ease 1.7s both;
  }

  @keyframes barLoad { from { width:0% } to { width:100% } }

  .bar-status {
    margin-top: 8px;
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    color: rgba(180,230,195,0.3);
    text-align: center;
    letter-spacing: 0.8px;
    animation: statusCycle 0.4s ease 1.7s both;
  }

  .status-dot {
    position: absolute;
    top: 44px;
    right: 22px;
    width: 7px;
    height: 7px;
  }

  .status-dot-inner {
    width: 7px;
    height: 7px;
    background: #4ade80;
    border-radius: 50%;
    animation: fadeUp 0.3s ease 2s both, dotPing 2.2s ease 2.2s infinite;
  }

  @keyframes dotPing {
    0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.55) }
    50%      { box-shadow: 0 0 0 5px rgba(74,222,128,0) }
  }

  .ver-tag {
    position: absolute;
    bottom: 40px;
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    color: rgba(180,230,195,0.18);
    letter-spacing: 0.5px;
    animation: fadeUp 0.4s ease 2.1s both;
  }

  .home-bar {
    position: absolute;
    bottom: 18px;
    width: 80px;
    height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
  }
</style>

<div class="phone-wrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="status-dot"><div class="status-dot-inner"></div></div>

    <div class="phone-inner">
      <div class="grid-bg"></div>
      <div class="radial-glow"></div>
      <div class="leaf-ring-2"></div>
      <div class="leaf-ring"></div>

      <div class="icon-box">
        <div class="icon-bg">
          <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 34 C19 34 19 18 19 14" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M19 23 C19 23 12 21 9 15 C9 15 16 12 19 18" fill="rgba(74,222,128,0.22)" stroke="#4ade80" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M19 18 C19 18 26 15 29 9 C29 9 22 6 19 12" fill="rgba(74,222,128,0.16)" stroke="#4ade80" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M19 13 C19 13 14 8 16 3 C16 3 22 4 22 10" fill="rgba(74,222,128,0.28)" stroke="#4ade80" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M12 34 L26 34" stroke="#1e4d28" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="19" cy="34" r="1.3" fill="#4ade80"/>
            <circle cx="27" cy="19" r="2.5" fill="none" stroke="rgba(74,222,128,0.45)" stroke-width="0.9"/>
            <circle cx="27" cy="19" r="1" fill="#4ade80"/>
            <circle cx="10" cy="25" r="2" fill="none" stroke="rgba(74,222,128,0.35)" stroke-width="0.9"/>
            <circle cx="10" cy="25" r="0.8" fill="#4ade80"/>
          </svg>
        </div>
      </div>

      <div class="title-area">
        <div class="t-main">Plant<span class="t-accent">Care</span></div>
        <div class="t-main" style="font-size:18px; font-weight:300; color:rgba(228,245,233,0.6); margin-top:2px;">Monitor</div>
      </div>

      <div class="tagline">Smart plant companion</div>

      <div class="feature-pills">
        <div class="pill"><span class="pill-dot"></span>Live data</div>
        <div class="pill"><span class="pill-dot"></span>Preferences</div>
        <div class="pill"><span class="pill-dot"></span>Suggestions</div>
      </div>

      <div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill"></div></div>
        <div class="bar-status">Connecting to sensors&hellip;</div>
      </div>

      <div class="ver-tag">v2.1.0</div>
    </div>

    <div class="home-bar"></div>
  </div>
</div>
