<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 44 44">
  <!-- Background box -->
  <rect width="44" height="44" rx="10" ry="10" fill="#152A1C" stroke="#4ADE8055" stroke-width="0.8"/>

  <!-- Stem -->
  <line x1="22" y1="42.68" x2="22" y2="16.72"
        stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Left leaf (mid) -->
  <path d="M 22 27.28
           C 14 25.52, 10 20.68, 11 16.72
           C 18 18.48, 24 22.88, 22 27.28 Z"
        fill="#4ADE8038" stroke="#4ADE80" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Right leaf (upper) -->
  <path d="M 22 21.12
           C 30 18.92, 34 14.08, 32 10.12
           C 25 12.32, 19 16.72, 22 21.12 Z"
        fill="#4ADE8028" stroke="#4ADE80" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Top leaf -->
  <path d="M 22 15.40
           C 18 11.00, 20 4.40, 24 2.20
           C 27 5.28, 26 11.00, 22 15.40 Z"
        fill="#4ADE8047" stroke="#4ADE80" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Soil line -->
  <line x1="12" y1="42.68" x2="32" y2="42.68"
        stroke="#1E4D28" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Root dot -->
  <circle cx="22" cy="42.68" r="1.8" fill="#4ADE80"/>

  <!-- Sensor dot 1 (right, mid) -->
  <circle cx="31" cy="21.56" r="3.2" fill="none" stroke="#4ADE8072" stroke-width="0.9"/>
  <circle cx="31" cy="21.56" r="1.3" fill="#4ADE80"/>

  <!-- Sensor dot 2 (left, lower) -->
  <circle cx="15" cy="28.60" r="2.6" fill="none" stroke="#4ADE8072" stroke-width="0.9"/>
  <circle cx="15" cy="28.60" r="1.0" fill="#4ADE80"/>
</svg>
